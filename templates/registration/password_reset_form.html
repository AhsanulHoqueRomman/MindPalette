{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<section class="auth-page reset-page">
    <div class="auth-card reset-card">
        <div class="reset-icon"></div>
        <div class="auth-header">
            <span class="section-kicker">Account Recovery</span>
            <h1>Reset your password</h1>
            <p>Enter your account email and we will send you a secure link to create a new password.</p>
        </div>

        <form method="post" novalidate class="auth-form reset-form">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-dark w-100 rounded-pill py-2">Send reset link</button>
        </form>

        <p class="auth-switch">
            Remembered your password?
            <a href="{% url 'login' %}">Back to login</a>
        </p>
    </div>
</section>

{% endblock %}
