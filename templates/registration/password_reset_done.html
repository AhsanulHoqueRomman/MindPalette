{% extends 'base.html' %}

{% block content %}

<section class="auth-page reset-page">
    <div class="auth-card reset-card text-center">
        <div class="reset-icon">✓</div>
        <div class="auth-header">
            <span class="section-kicker">Check Your Inbox</span>
            <h1>Email sent</h1>
            <p>If an account exists for that email, a password reset link has been sent. Follow the instructions in the message to continue.</p>
        </div>

        <div class="reset-actions">
            <a href="{% url 'login' %}" class="btn btn-dark rounded-pill px-4 py-2">Back to Login</a>
            <a href="{% url 'home' %}" class="btn btn-outline-dark rounded-pill px-4 py-2">Return Home</a>
        </div>
    </div>
</section>

{% endblock %}
