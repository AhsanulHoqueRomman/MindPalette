<aside class="col-lg-3">
    <div class="dashboard-sidebar">
        <div class="dashboard-sidebar-header">
            <span class="dashboard-icon">MP</span>
            <div>
                <strong>Dashboard</strong>
                <small>{{ user.username }}</small>
            </div>
        </div>

        <nav class="dashboard-nav" aria-label="Dashboard navigation">
            <a href="{% url 'dashboard' %}"
               class="dashboard-nav-link {% if '/dashboard/' == request.path %}active{% endif %}">
                <span class="nav-icon">D</span>
                Overview
            </a>

            {% if perms.auth.view_user %}
            <a href="{% url 'users' %}"
               class="dashboard-nav-link {% if '/users/' in request.path %}active{% endif %}">
                <span class="nav-icon">U</span>
                Users
            </a>
            {% endif %}

            <a href="{% url 'categories' %}"
               class="dashboard-nav-link {% if '/categories/' in request.path %}active{% endif %}">
                <span class="nav-icon">C</span>
                Categories
            </a>

            <a href="{% url 'posts' %}"
               class="dashboard-nav-link {% if '/posts/' in request.path %}active{% endif %}">
                <span class="nav-icon">P</span>
                Posts
            </a>

            <a href="{% url 'logout' %}" class="dashboard-nav-link text-danger">
                <span class="nav-icon">L</span>
                Logout
            </a>
        </nav>
    </div>
</aside>
